services:
  db:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: secondloop
    ports: ["5432:5432"]
  partner:
    build: .
    command: uvicorn fakes.parcelpath:app --host 0.0.0.0 --port 8081
    environment:
      PARCELPATH_DELAY_MS: "180"
    ports: ["8081:8081"]
  mailer:
    build: .
    command: uvicorn fakes.mailer:app --host 0.0.0.0 --port 8082
    ports: ["8082:8082"]
  api:
    build: .
    command: uvicorn secondloop.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres@db/secondloop
      PARCELPATH_URL: http://partner:8081
      MAILER_URL: http://mailer:8082
    ports: ["8000:8000"]
    depends_on: [db, partner, mailer]
  worker:
    build: .
    command: python -m secondloop.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres@db/secondloop
      MAILER_URL: http://mailer:8082
    depends_on: [db, mailer]
